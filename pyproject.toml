[project]
name = "calorie-tracker"
version = "0.33.0"
description = "A simple calorie and fitness tracker"
requires-python = ">=3.9"
dependencies = ["flet==1.0.3"]

[tool.flet]
product = "Calorie Tracker"
org = "com.calorietracker"
company = "Calorie Tracker"

[tool.flet.app]
module = "main.py"
exclude = ["tests", "__pycache__", "*.pyc", "README.md", "PROJECT_CONTEXT.md"]

[tool.flet.android]
min_sdk_version = 24
